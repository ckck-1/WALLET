services:
  - type: web
    name: business-wallet-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false   # set manually in Render dashboard
      - key: MOMO_WEBHOOK_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
